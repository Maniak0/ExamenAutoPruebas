# =============================================================================
#  ACTIVIDAD 2 - PIPELINE DE INTEGRACIÓN CONTINUA EJECUTABLE EN GITHUB ACTIONS
# -----------------------------------------------------------------------------
#  El Jenkinsfile y el .gitlab-ci.yml de este repositorio describen el mismo
#  proceso para servidores Jenkins y GitLab. Este workflow cumple idéntica
#  función sobre la infraestructura de GitHub y tiene una ventaja práctica: se
#  ejecuta automáticamente con cada push, de modo que la pestaña "Actions" del
#  repositorio constituye la EVIDENCIA de ejecución exitosa del pipeline.
# =============================================================================

name: CI - Build y Pruebas Automatizadas

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:        # Permite dispararlo manualmente desde la interfaz

env:
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: BUILD Y PRUEBAS UNITARIAS  (feedback rápido, estrategia "fail fast")
  # ---------------------------------------------------------------------------
  build-y-pruebas-unitarias:
    name: Build + Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven              # Caché de dependencias para acelerar el build

      - name: Compilar el proyecto
        run: mvn $MAVEN_CLI_OPTS clean compile -DskipTests

      - name: Análisis del árbol de dependencias
        run: mvn $MAVEN_CLI_OPTS dependency:tree -Dverbose

      - name: Ejecutar PRUEBAS UNITARIAS (JUnit 5 + Mockito)
        run: mvn $MAVEN_CLI_OPTS test

      - name: Publicar reporte de pruebas unitarias
        if: always()               # También cuando fallan: es cuando más se necesita
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

  # ---------------------------------------------------------------------------
  # JOB 2: PRUEBAS DE INTEGRACIÓN Y ACEPTACIÓN
  # Depende del job anterior: no tiene sentido integrar si lo unitario falla.
  # ---------------------------------------------------------------------------
  pruebas-integracion:
    name: Pruebas de Integración + Aceptación
    runs-on: ubuntu-latest
    needs: build-y-pruebas-unitarias

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar PRUEBAS DE INTEGRACIÓN y ACEPTACIÓN (Failsafe)
        run: mvn $MAVEN_CLI_OPTS verify

      - name: Publicar reportes de integración y BDD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-integracion
          path: |
            target/failsafe-reports/
            target/cucumber-report.html

  # ---------------------------------------------------------------------------
  # JOB 3: QUALITY GATE Y EMPAQUETADO DEL ARTEFACTO
  # ---------------------------------------------------------------------------
  quality-gate-y-empaquetado:
    name: Quality Gate + Empaquetado
    runs-on: ubuntu-latest
    needs: pruebas-integracion

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Quality Gate - verificar cobertura mínima del 80%
        run: mvn $MAVEN_CLI_OPTS verify jacoco:report jacoco:check

      - name: Empaquetar el artefacto desplegable
        run: mvn $MAVEN_CLI_OPTS package -DskipTests

      - name: Registrar metadatos de auditoría del build
        run: |
          cat > target/build-metadata.json <<EOF
          {
            "artefacto":   "reservas-automatizacion",
            "version":     "1.0.${{ github.run_number }}",
            "ejecucion":   "${{ github.run_id }}",
            "commit":      "${{ github.sha }}",
            "rama":        "${{ github.ref_name }}",
            "autor":       "${{ github.actor }}",
            "marcaTiempo": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat target/build-metadata.json

      - name: Publicar artefacto y reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: artefacto-desplegable
          path: |
            target/*.jar
            target/build-metadata.json
            target/site/jacoco/

      - name: Resumen del pipeline
        run: |
          echo "### Pipeline de CI completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Compilación: correcta" >> $GITHUB_STEP_SUMMARY
          echo "- Pruebas unitarias: ejecutadas" >> $GITHUB_STEP_SUMMARY
          echo "- Pruebas de integración y aceptación: ejecutadas" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate de cobertura: superado" >> $GITHUB_STEP_SUMMARY
          echo "- Artefacto: reservas-automatizacion.jar publicado" >> $GITHUB_STEP_SUMMARY
